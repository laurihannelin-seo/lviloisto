media:
  input: public/images
  output: /images
  rename: safe
  categories: [image]

settings:
  hide: true
  content:
    merge: true
  commit:
    identity: user
    templates:
      update: "Sisältöpäivitys: {name} ({userName})"

components:
  seo:
    type: object
    label: Hakukonenäkyvyys
    fields:
      - name: title
        label: Sivun title
        type: string
        required: true
        description: Näkyy selaimen välilehdellä ja Googlen hakutuloksissa.
      - name: description
        label: Meta description
        type: text
        required: true

  image:
    type: object
    label: Kuva
    fields:
      - name: image
        label: Kuva
        type: image
        required: true
      - name: imageAlt
        label: Kuvan alt-teksti
        type: string
        required: true
        description: Kuvaile kuvan sisältö lyhyesti saavutettavuutta varten.

  text_item:
    type: object
    label: Tekstinosto
    fields:
      - name: title
        label: Otsikko
        type: string
        required: true
      - name: text
        label: Teksti
        type: text
        required: true

  faq_item:
    type: object
    label: Kysymys ja vastaus
    fields:
      - name: question
        label: Kysymys
        type: string
        required: true
      - name: answer
        label: Vastaus
        type: text
        required: true

  numbered_item:
    type: object
    label: Numeroitu nosto
    fields:
      - name: number
        label: Numero
        type: string
        required: true
      - name: title
        label: Otsikko
        type: string
        required: true
      - name: text
        label: Teksti
        type: text
        required: true

  image_item:
    type: object
    label: Kuva
    fields:
      - name: image
        label: Kuva
        type: image
        required: true
      - name: imageAlt
        label: Kuvan alt-teksti
        type: string
        required: true

  contact_group:
    type: object
    label: Yhteystietoryhmä
    fields:
      - name: id
        type: string
        hidden: true
      - name: label
        label: Otsikko
        type: string
        required: true
      - name: kind
        type: string
        hidden: true
      - name: items
        label: Tiedot
        type: object
        list:
          min: 1
          collapsible:
            collapsed: true
            summary: "{text}"
        fields:
          - name: text
            label: Teksti
            type: string
            required: true
          - name: href
            label: Linkki
            type: string
            hidden: true

